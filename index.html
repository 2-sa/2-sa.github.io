<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الموقع تحت الصيانة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 500px;
      padding: 24px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    p {
      color: #ccc;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>الموقع تحت الصيانة</h1>
    <p>نرجع قريبًا. شكرًا لتفهمكم.</p>
  </div>
</body>
</html>
